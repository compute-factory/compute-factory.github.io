<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-Loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">大语言模型自回归生成循环（Autoregressive Generation Loop）</text>
  <text x="440" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">每一轮前向传播只预测下一个位置的概率分布，采样选出一个 Token 后拼接回输入序列末尾</text>

  <!-- Step 1: Context Sequence -->
  <g filter="url(#shadow)">
    <rect x="30" y="95" width="230" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="30" y="95" width="230" height="34" rx="10" fill="#f1f5f9"/>
    <text x="145" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">1. 当前上下文序列 (x₁ ... xₜ₋₁)</text>

    <!-- Token boxes -->
    <rect x="44" y="145" width="44" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="66" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">大</text>
    <text x="66" y="193" text-anchor="middle" font-size="10.5" fill="#64748b">x₁</text>

    <rect x="94" y="145" width="44" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="116" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">语言</text>
    <text x="116" y="193" text-anchor="middle" font-size="10.5" fill="#64748b">x₂</text>

    <rect x="144" y="145" width="44" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="166" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">模型</text>
    <text x="166" y="193" text-anchor="middle" font-size="10.5" fill="#64748b">x₃</text>

    <rect x="194" y="145" width="52" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="220" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">运行</text>
    <text x="220" y="193" text-anchor="middle" font-size="10.5" fill="#b45309" font-weight="600">x₄ (新拼入)</text>

    <text x="145" y="232" text-anchor="middle" font-size="11.5" fill="#475569">每次循环输入长度 +1</text>
    <text x="145" y="250" text-anchor="middle" font-size="11" fill="#94a3b8">受上下文窗口 (Context Window) 限制</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="260" y1="182" x2="302" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: LLM Backbone Forward Pass -->
  <g filter="url(#shadow)">
    <rect x="310" y="95" width="185" height="175" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <text x="402" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">2. LLM 前向传播</text>
    <text x="402" y="144" text-anchor="middle" font-size="11.5" fill="#94a3b8">(Forward Pass)</text>

    <!-- Layers Stack visual -->
    <rect x="332" y="158" width="140" height="22" rx="4" fill="#334155" stroke="#475569"/>
    <text x="402" y="173" text-anchor="middle" font-size="11" fill="#e2e8f0">Embedding + 位置编码</text>

    <rect x="332" y="186" width="140" height="28" rx="4" fill="#0f766e" stroke="#14b8a6"/>
    <text x="402" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#f0fdfa">N × Transformer 层</text>

    <rect x="332" y="220" width="140" height="22" rx="4" fill="#334155" stroke="#475569"/>
    <text x="402" y="235" text-anchor="middle" font-size="11" fill="#e2e8f0">LM Head → Softmax</text>

    <text x="402" y="259" text-anchor="middle" font-size="10.5" fill="#38bdf8">数十亿参数 W 固定只读</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="495" y1="182" x2="537" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Probability Distribution -->
  <g filter="url(#shadow)">
    <rect x="545" y="95" width="175" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="545" y="95" width="175" height="34" rx="10" fill="#f1f5f9"/>
    <text x="632" y="117" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">3. 词表条件概率 P(x₅|x₁..₄)</text>

    <!-- Bar 1 -->
    <text x="557" y="153" font-size="12" font-weight="600" fill="#0f766e">"在"</text>
    <rect x="590" y="141" width="88" height="15" rx="3" fill="#0d9488"/>
    <text x="683" y="153" font-size="11" font-weight="600" fill="#0f766e">62%</text>

    <!-- Bar 2 -->
    <text x="557" y="177" font-size="12" fill="#475569">"于"</text>
    <rect x="590" y="165" width="32" height="15" rx="3" fill="#94a3b8"/>
    <text x="627" y="177" font-size="11" fill="#64748b">21%</text>

    <!-- Bar 3 -->
    <text x="557" y="201" font-size="12" fill="#475569">"时"</text>
    <rect x="590" y="189" width="15" height="15" rx="3" fill="#cbd5e1"/>
    <text x="610" y="201" font-size="11" fill="#64748b">9%</text>

    <!-- Bar 4 -->
    <text x="557" y="225" font-size="12" fill="#475569">"..."</text>
    <rect x="590" y="213" width="11" height="15" rx="3" fill="#e2e8f0"/>
    <text x="606" y="225" font-size="11" fill="#94a3b8">8%</text>

    <text x="632" y="252" text-anchor="middle" font-size="11" fill="#64748b">词表大小 V (如 151,936)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="720" y1="182" x2="754" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Sampled Next Token -->
  <g filter="url(#shadow)">
    <rect x="762" y="125" width="92" height="115" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="808" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">4. 采样输出</text>
    <rect x="782" y="160" width="52" height="38" rx="6" fill="#f59e0b"/>
    <text x="808" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">在</text>
    <text x="808" y="218" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">新词元 x₅</text>
  </g>

  <!-- Feedback Loop Arrow from Step 4 back to Step 1 -->
  <path d="M 808 240 L 808 338 Q 808 358 788 358 L 240 358 Q 220 358 220 338 L 220 278" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-Loop)"/>

  <!-- Feedback Loop Label Box (Widened so both lines have ample padding) -->
  <rect x="260" y="330" width="500" height="52" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">自回归反馈循环：将新生成的 x₅ 追加至输入序列末尾</text>
  <text x="510" y="372" text-anchor="middle" font-size="11.5" fill="#d97706">重复执行步骤 1 → 4，直至采样出结束标记 &lt;|endoftext|&gt; 或达到最大长度</text>
</svg>
