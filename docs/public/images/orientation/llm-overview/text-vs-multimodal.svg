<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">多模态视觉-语言模型（VLM）双支路输入与统一序列拼接架构</text>
  <text x="440" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">不同模态经过各自编码器与投影层对齐到同一隐藏层维度 d，拼接后共用同一个 LLM 主干自回归生成</text>

  <!-- Top Branch: Vision Modality -->
  <g filter="url(#shadow4)">
    <rect x="25" y="75" width="465" height="145" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="25" y="75" width="465" height="30" rx="10" fill="#eff6ff"/>
    <text x="42" y="95" font-size="13" font-weight="700" fill="#1d4ed8">视觉模态支路（图像 / 视频帧 → 视觉词元向量）</text>

    <!-- Image Patch Grid -->
    <rect x="42" y="118" width="68" height="68" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Grid lines -->
    <line x1="64" y1="118" x2="64" y2="186" stroke="#3b82f6" stroke-width="1"/>
    <line x1="87" y1="118" x2="87" y2="186" stroke="#3b82f6" stroke-width="1"/>
    <line x1="42" y1="140" x2="110" y2="140" stroke="#3b82f6" stroke-width="1"/>
    <line x1="42" y1="163" x2="110" y2="163" stroke="#3b82f6" stroke-width="1"/>
    <text x="76" y="203" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">图像切片 (Patches)</text>

    <line x1="110" y1="152" x2="142" y2="152" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow4)"/>

    <!-- Vision Encoder (ViT) -->
    <rect x="148" y="118" width="135" height="68" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="215" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">视觉编码器 (ViT)</text>
    <text x="215" y="160" text-anchor="middle" font-size="11" fill="#0284c7">提取各块视觉特征</text>
    <text x="215" y="176" text-anchor="middle" font-size="10.5" fill="#0369a1">输出维度: [N_img, d_v]</text>

    <line x1="283" y1="152" x2="315" y2="152" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow4)"/>

    <!-- Projector / Adapter -->
    <rect x="321" y="118" width="150" height="68" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="396" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">模态投影层 (Projector)</text>
    <text x="396" y="160" text-anchor="middle" font-size="11" fill="#6d28d9">对齐向量空间 d_v → d</text>
    <text x="396" y="176" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4c1d95">输出: [N_img, d] 视觉向量</text>
  </g>

  <!-- Bottom Branch: Text Modality -->
  <g filter="url(#shadow4)">
    <rect x="25" y="245" width="465" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="25" y="245" width="465" height="30" rx="10" fill="#f1f5f9"/>
    <text x="42" y="265" font-size="13" font-weight="700" fill="#334155">文本模态支路（提示词字符串 → 文本词元向量）</text>

    <!-- Input Text -->
    <rect x="42" y="292" width="110" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="97" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">输入文本提问</text>
    <text x="97" y="338" text-anchor="middle" font-size="11.5" fill="#0f172a">"图里有什么？"</text>

    <line x1="152" y1="324" x2="184" y2="324" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow4)"/>

    <!-- Tokenizer -->
    <rect x="190" y="292" width="110" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="245" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">分词器 Tokenizer</text>
    <text x="245" y="338" text-anchor="middle" font-size="10.5" fill="#475569">切分为 Token IDs</text>

    <line x1="300" y1="324" x2="328" y2="324" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow4)"/>

    <!-- Embedding Layer -->
    <rect x="334" y="292" width="137" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="402" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">词嵌入层 Embedding</text>
    <text x="402" y="334" text-anchor="middle" font-size="11" fill="#d97706">查表映射 ID → 向量</text>
    <text x="402" y="349" text-anchor="middle" font-size="10.5" font-weight="600" fill="#92400e">输出: [N_txt, d] 文本向量</text>
  </g>

  <!-- Merge Arrows to Unified Sequence -->
  <path d="M 471 152 L 515 152 L 515 215 L 538 215" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>
  <path d="M 471 324 L 515 324 L 515 255 L 538 255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Unified Sequence & LLM Backbone -->
  <g filter="url(#shadow4)">
    <rect x="545" y="75" width="310" height="315" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="545" y="75" width="310" height="32" rx="10" fill="#ecfdf5"/>
    <text x="700" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">统一特征序列拼接 &amp; LLM 主干推理</text>

    <!-- Concatenated Sequence Visual -->
    <text x="700" y="124" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">维度一致 (同为 d)，按位置直接拼接：</text>
    <g transform="translate(562, 134)">
      <rect x="0" y="0" width="46" height="32" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="23" y="20" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">Img 1</text>

      <rect x="50" y="0" width="46" height="32" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="73" y="20" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">Img 2</text>

      <rect x="100" y="0" width="46" height="32" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="123" y="20" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">...Img N</text>

      <rect x="150" y="0" width="42" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="171" y="20" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b45309">图里</text>

      <rect x="196" y="0" width="42" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="217" y="20" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b45309">有</text>

      <rect x="242" y="0" width="36" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="260" y="20" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b45309">...？</text>
    </g>
    <text x="700" y="183" text-anchor="middle" font-size="10.5" fill="#dc2626" font-weight="600">注意：1 张高清图可产生数百至数千个 Visual Tokens</text>

    <line x1="700" y1="190" x2="700" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>

    <!-- LLM Backbone -->
    <rect x="570" y="220" width="260" height="72" rx="8" fill="#1e293b" stroke="#0f172a"/>
    <text x="700" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Transformer 语言模型主干</text>
    <text x="700" y="266" text-anchor="middle" font-size="11.5" fill="#38bdf8">跨模态自注意力交互 (Self-Attention)</text>
    <text x="700" y="283" text-anchor="middle" font-size="10.5" fill="#94a3b8">后续计算与纯文本 LLM 完全相同</text>

    <line x1="700" y1="292" x2="700" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)"/>

    <!-- Final Text Output -->
    <rect x="570" y="324" width="260" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="700" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">自回归逐 Token 输出回答文本</text>
    <text x="700" y="362" text-anchor="middle" font-size="11" fill="#059669">"图中是一块安装在服务器上的 GPU..."</text>
  </g>
</svg>
