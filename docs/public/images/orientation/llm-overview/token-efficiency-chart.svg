<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">
  <defs>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">实测数据对比：同一段 500 字中文技术文本在不同 Tokenizer 下的开销差异</text>
  <text x="440" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">测试样本：500 个汉字（UTF-8 编码共 1,500 字节）在 7B 模型（FP16，单请求）上的切分数量与系统开销</text>

  <!-- Chart Area Card -->
  <g filter="url(#shadow5)">
    <rect x="25" y="72" width="830" height="295" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Grid Lines (vertical) -->
    <line x1="250" y1="100" x2="250" y2="305" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="370" y1="100" x2="370" y2="305" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="490" y1="100" x2="490" y2="305" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="610" y1="100" x2="610" y2="305" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="730" y1="100" x2="730" y2="305" stroke="#f1f5f9" stroke-width="1"/>

    <!-- X-Axis Labels (0 to 1000 Tokens, 120px per 250 tokens -> 0.48px per token) -->
    <text x="250" y="92" text-anchor="middle" font-size="11" fill="#64748b">0</text>
    <text x="370" y="92" text-anchor="middle" font-size="11" fill="#64748b">250 Tokens</text>
    <text x="490" y="92" text-anchor="middle" font-size="11" fill="#64748b">500 Tokens</text>
    <text x="610" y="92" text-anchor="middle" font-size="11" fill="#64748b">750 Tokens</text>
    <text x="730" y="92" text-anchor="middle" font-size="11" fill="#64748b">1000 Tokens</text>

    <!-- Row 1: Qwen2.5 / Qwen3 (151K Vocab) -> ~290 Tokens -->
    <text x="236" y="132" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Qwen2.5 / DeepSeek</text>
    <text x="236" y="150" text-anchor="end" font-size="11" fill="#64748b">多语言大词表 (V ≈ 128K~152K)</text>
    <rect x="250" y="116" width="139" height="36" rx="5" fill="#10b981"/>
    <text x="400" y="133" font-size="13" font-weight="700" fill="#047857">290 Tokens （平均 1.72 汉字 / Token）</text>
    <text x="400" y="150" font-size="11.5" fill="#059669">基准耗时: 1.0×  |  KV Cache 显存占用: 1.0×</text>

    <!-- Row 2: Llama 3 (128K Vocab) -> ~365 Tokens -->
    <text x="236" y="198" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">Llama 3 / 3.1</text>
    <text x="236" y="216" text-anchor="end" font-size="11" fill="#64748b">扩充通用词表 (V = 128,256)</text>
    <rect x="250" y="182" width="175" height="36" rx="5" fill="#0284c7"/>
    <text x="436" y="199" font-size="13" font-weight="700" fill="#0369a1">365 Tokens （平均 1.37 汉字 / Token）</text>
    <text x="436" y="216" font-size="11.5" fill="#0284c7">基准耗时: 1.26×  |  KV Cache 显存占用: 1.26×</text>

    <!-- Row 3: Llama 1 / 2 (32K Vocab) -> ~740 Tokens -->
    <text x="236" y="264" text-anchor="end" font-size="13" font-weight="700" fill="#0f172a">初代 Llama / Llama 2</text>
    <text x="236" y="282" text-anchor="end" font-size="11" fill="#64748b">早期英文主导词表 (V = 32,000)</text>
    <rect x="250" y="248" width="355" height="36" rx="5" fill="#ef4444"/>
    <text x="616" y="265" font-size="13" font-weight="700" fill="#b91c1c">740 Tokens （平均 0.68 汉字 / Token）</text>
    <text x="616" y="282" font-size="11.5" fill="#dc2626">基准耗时: 2.55×  |  KV Cache 显存占用: 2.55×</text>

    <!-- Bottom Takeaway Banner -->
    <rect x="45" y="315" width="790" height="36" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="440" y="338" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">工程结论：输出同样一段 500 字中文回答，词表中文压缩率高的模型可减少约 60% 的自回归前向步数与 KV Cache 显存开销</text>
  </g>
</svg>
