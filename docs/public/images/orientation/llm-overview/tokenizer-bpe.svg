<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Tokenizer 编解码链路与 BPE（字节对编码）合并机制</text>

  <!-- Section A: Top Pipeline -->
  <g filter="url(#shadow2)">
    <rect x="25" y="52" width="830" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="45" y="76" font-size="13.5" font-weight="700" fill="#1e293b">A. 文本与模型之间的双向转换流水线</text>

    <!-- Raw String -->
    <rect x="45" y="92" width="135" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="112" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">原始字符串</text>
    <text x="112" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">"AI Infra"</text>
    <text x="112" y="155" text-anchor="middle" font-size="10.5" fill="#64748b">人类可读文本</text>

    <line x1="180" y1="128" x2="215" y2="128" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>
    <text x="197" y="118" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">切分</text>

    <!-- Subwords -->
    <rect x="220" y="92" width="165" height="72" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="302" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">Token 序列（子词）</text>
    <rect x="234" y="124" width="38" height="24" rx="4" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="253" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">AI</text>
    <rect x="278" y="124" width="46" height="24" rx="4" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="301" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">␣Inf</text>
    <rect x="330" y="124" width="40" height="24" rx="4" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="350" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">ra</text>
    <text x="302" y="160" text-anchor="middle" font-size="10" fill="#0369a1">Encode（编码阶段）</text>

    <line x1="385" y1="128" x2="420" y2="128" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>
    <text x="402" y="118" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">查词表</text>

    <!-- Token IDs -->
    <rect x="425" y="92" width="165" height="72" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="507" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">整数编号 (Token IDs)</text>
    <text x="507" y="141" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4c1d95">[15836, 39514, 1682]</text>
    <text x="507" y="158" text-anchor="middle" font-size="10.5" fill="#6d28d9">词表范围: 0 ~ V-1</text>

    <line x1="590" y1="128" x2="625" y2="128" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow2)"/>

    <!-- LLM & Decode -->
    <rect x="630" y="92" width="205" height="72" rx="8" fill="#ecfdf5" stroke="#34d399"/>
    <text x="732" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">LLM 推理输出新 ID → Decode</text>
    <text x="732" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">ID: 104307 ──> "系统"</text>
    <text x="732" y="156" text-anchor="middle" font-size="10.5" fill="#059669">反向查表还原为字符串</text>
  </g>

  <!-- Section B: Bottom Left - BPE Merge Tree -->
  <g filter="url(#shadow2)">
    <rect x="25" y="220" width="420" height="245" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="42" y="246" font-size="13.5" font-weight="700" fill="#1e293b">B. BPE 自底向上高频合并示意（以 "learning" 为例）</text>
    <text x="42" y="265" font-size="11.5" fill="#64748b">从基础单字节出发，逐轮合并语料中相邻出现频率最高的配对：</text>

    <!-- Round 0 -->
    <text x="42" y="295" font-size="11.5" font-weight="600" fill="#475569">1. 初始字节：</text>
    <g transform="translate(132, 279)">
      <rect x="0" y="0" width="30" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="15" y="16" text-anchor="middle" font-size="12" fill="#334155">l</text>
      <rect x="36" y="0" width="30" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="51" y="16" text-anchor="middle" font-size="12" fill="#334155">e</text>
      <rect x="72" y="0" width="30" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="87" y="16" text-anchor="middle" font-size="12" fill="#334155">a</text>
      <rect x="108" y="0" width="30" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="123" y="16" text-anchor="middle" font-size="12" fill="#334155">r</text>
      <rect x="144" y="0" width="30" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="159" y="16" text-anchor="middle" font-size="12" fill="#334155">n</text>
      <rect x="180" y="0" width="30" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="195" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">i</text>
      <rect x="216" y="0" width="30" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="231" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">n</text>
      <rect x="252" y="0" width="30" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="267" y="16" text-anchor="middle" font-size="12" fill="#334155">g</text>
    </g>

    <!-- Round 1 -->
    <text x="42" y="340" font-size="11.5" font-weight="600" fill="#475569">2. 高频配对：</text>
    <g transform="translate(132, 324)">
      <rect x="0" y="0" width="66" height="24" rx="4" fill="#e0f2fe" stroke="#38bdf8"/><text x="33" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">le</text>
      <rect x="72" y="0" width="66" height="24" rx="4" fill="#e0f2fe" stroke="#38bdf8"/><text x="105" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">ar</text>
      <rect x="144" y="0" width="30" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="159" y="16" text-anchor="middle" font-size="12" fill="#334155">n</text>
      <rect x="180" y="0" width="66" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="213" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">in</text>
      <rect x="252" y="0" width="30" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="267" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">g</text>
    </g>

    <!-- Round 2 -->
    <text x="42" y="385" font-size="11.5" font-weight="600" fill="#475569">3. 最终子词：</text>
    <g transform="translate(132, 368)">
      <rect x="0" y="0" width="154" height="28" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
      <text x="77" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">learn（词根 Token）</text>
      <rect x="162" y="0" width="128" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="226" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">ing（词缀 Token）</text>
    </g>

    <text x="42" y="428" font-size="11.5" fill="#334155">• 常见词直接合成为 1 个完整 Token，缩短序列长度</text>
    <text x="42" y="448" font-size="11.5" fill="#334155">• 生僻词可回退拆解为子词或 UTF-8 字节，彻底消除 OOV 未知词</text>
  </g>

  <!-- Section C: Bottom Right - Multilingual UTF-8 & Token Granularity -->
  <g filter="url(#shadow2)">
    <rect x="465" y="220" width="390" height="245" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="485" y="246" font-size="13.5" font-weight="700" fill="#1e293b">C. 多语言编码差异与系统开销对比</text>
    <text x="485" y="265" font-size="11.5" fill="#64748b">单个汉字在 UTF-8 中占 3 字节，词表中文覆盖率直接决定 Token 数量：</text>

    <!-- Case 1: Multilingual Tokenizer -->
    <rect x="485" y="280" width="350" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="500" y="300" font-size="12" font-weight="700" fill="#166534">多语言优化词表（如 Qwen / Llama 3，V ≈ 128K~152K）</text>
    <text x="500" y="322" font-size="12" fill="#15803d">"算力工地" ──> ["算力", "工地"] （仅需 2 个 Token）</text>
    <text x="500" y="341" font-size="11" fill="#16a34a">✓ 高频中文词组已合并入表，推理延迟低、KV Cache 显存省</text>

    <!-- Case 2: English-centric Tokenizer -->
    <rect x="485" y="366" width="350" height="82" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="500" y="386" font-size="12" font-weight="700" fill="#991b1b">早期英文主导小词表（如初代 Llama，V = 32K）</text>
    <text x="500" y="408" font-size="11.5" fill="#b91c1c">"算力工地" → ["算", "力", "工", "0xE5", "0x9C", "0xB0"] (6 Tokens)</text>
    <text x="500" y="429" font-size="11" fill="#dc2626">✗ 未收录汉字退化为 3 个 UTF-8 字节 Token，耗时与显存翻倍</text>
  </g>
</svg>
