<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">
  <defs>
    <marker id="arrow-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-bwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-opt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">预训练 / 微调 与 推理阶段的计算链路及显存构成对比</text>

  <!-- Top Half: Pre-training & Fine-tuning -->
  <g filter="url(#shadow3)">
    <rect x="25" y="52" width="830" height="255" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="25" y="52" width="830" height="34" rx="10" fill="#eff6ff"/>
    <text x="45" y="74" font-size="14" font-weight="700" fill="#1e3a8a">1. 训练阶段（预训练 Pre-training &amp; 微调 Fine-tuning）：闭环更新，显存与算力开销极大</text>

    <!-- Step 4 Return Arrow at Top Channel (y=98..122, completely below header bar) -->
    <path d="M 745 128 L 745 104 L 312 104 L 312 124" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-opt)"/>
    <rect x="398" y="92" width="260" height="20" rx="4" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="528" y="106" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6d28d9">步骤 4：将更新后的参数写回模型权重 W</text>

    <!-- Input Corpus -->
    <rect x="45" y="134" width="115" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="102" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">训练语料 / 指令</text>
    <text x="102" y="179" text-anchor="middle" font-size="11" fill="#64748b">含真实标签 Target</text>

    <!-- Forward Arrow -->
    <line x1="160" y1="166" x2="215" y2="166" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-fwd)"/>
    <text x="187" y="156" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">前向</text>

    <!-- Model Layers (Trainable) -->
    <rect x="220" y="128" width="185" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="312" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">模型网络参数 W (可写)</text>
    <text x="312" y="171" text-anchor="middle" font-size="11" fill="#0284c7">1. 前向传播 (Forward Pass)</text>
    <text x="312" y="189" text-anchor="middle" font-size="10.5" fill="#0369a1">需暂存各层激活值 Activations</text>

    <!-- Forward to Loss -->
    <line x1="405" y1="166" x2="465" y2="166" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-fwd)"/>
    <text x="435" y="156" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">预测分布</text>

    <!-- Loss Function -->
    <rect x="470" y="128" width="145" height="76" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="542" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">2. 损失函数 (Loss)</text>
    <text x="542" y="172" text-anchor="middle" font-size="11" fill="#dc2626">对比预测值与真实标签</text>
    <text x="542" y="189" text-anchor="middle" font-size="10.5" fill="#ef4444">计算误差标量 L</text>

    <!-- Optimizer Box -->
    <rect x="655" y="128" width="180" height="76" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="745" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">3. 优化器 (Optimizer)</text>
    <text x="745" y="171" text-anchor="middle" font-size="11" fill="#6d28d9">利用梯度 ∇W 与动量状态</text>
    <text x="745" y="189" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">更新权重: W ← W - η·ΔW</text>

    <!-- Backward Pass Channel Below Boxes (y=204..234) -->
    <path d="M 542 204 L 542 226 L 312 226 L 312 208" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-bwd)"/>
    <rect x="362" y="215" width="135" height="20" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="429" y="229" text-anchor="middle" font-size="10.5" font-weight="600" fill="#dc2626">反向传播求梯度 ∇W</text>

    <path d="M 542 226 L 745 226 L 745 208" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-bwd)"/>
    <rect x="580" y="215" width="130" height="20" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="645" y="229" text-anchor="middle" font-size="10.5" font-weight="600" fill="#dc2626">将梯度 ∇W 送入优化器</text>

    <!-- VRAM Breakdown Bar (Training) -->
    <text x="45" y="276" font-size="12" font-weight="700" fill="#334155">训练显存占用构成：</text>
    <rect x="165" y="260" width="120" height="26" rx="4" fill="#0284c7"/>
    <text x="225" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">模型权重 (Weights)</text>
    <rect x="289" y="260" width="120" height="26" rx="4" fill="#ef4444"/>
    <text x="349" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">参数梯度 (Gradients)</text>
    <rect x="413" y="260" width="230" height="26" rx="4" fill="#8b5cf6"/>
    <text x="528" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">优化器状态 (Optimizer States, 占比最大)</text>
    <rect x="647" y="260" width="188" height="26" rx="4" fill="#f59e0b"/>
    <text x="741" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">前向激活值 (Activations)</text>
  </g>

  <!-- Bottom Half: Inference -->
  <g filter="url(#shadow3)">
    <rect x="25" y="325" width="830" height="182" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="25" y="325" width="830" height="34" rx="10" fill="#ecfdf5"/>
    <text x="45" y="347" font-size="14" font-weight="700" fill="#065f46">2. 推理阶段（Inference）：权重只读冻结，仅执行前向传播，追求低延迟与高并发</text>

    <!-- User Prompt -->
    <rect x="45" y="376" width="115" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="102" y="401" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">在线用户请求</text>
    <text x="102" y="419" text-anchor="middle" font-size="11" fill="#64748b">Prompt Tokens</text>

    <line x1="160" y1="406" x2="215" y2="406" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-fwd)"/>
    <text x="187" y="396" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">仅前向</text>

    <!-- Frozen Model + KV Cache -->
    <rect x="220" y="372" width="245" height="68" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.8"/>
    <text x="342" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">模型网络参数 W (只读冻结 🔒)</text>
    <text x="342" y="413" text-anchor="middle" font-size="11" fill="#059669">仅执行前向传播 + 读写 KV Cache 缓存</text>
    <text x="342" y="429" text-anchor="middle" font-size="10.5" fill="#64748b">无 Loss 计算 / 无反向求导 / 无优化器</text>

    <line x1="465" y1="406" x2="525" y2="406" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow-fwd)"/>

    <!-- Generated Output -->
    <rect x="530" y="376" width="165" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="612" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">流式生成回复 Tokens</text>
    <text x="612" y="419" text-anchor="middle" font-size="11" fill="#d97706">关注 TTFT 与 TPOT 延迟</text>

    <!-- Removed components badge -->
    <rect x="712" y="376" width="123" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,2"/>
    <text x="773" y="399" text-anchor="middle" font-size="11.5" font-weight="600" fill="#94a3b8">✗ 梯度已省去</text>
    <text x="773" y="418" text-anchor="middle" font-size="11.5" font-weight="600" fill="#94a3b8">✗ 优化器已省去</text>

    <!-- VRAM Breakdown Bar (Inference) -->
    <text x="45" y="476" font-size="12" font-weight="700" fill="#334155">推理显存占用构成：</text>
    <rect x="165" y="460" width="140" height="26" rx="4" fill="#0284c7"/>
    <text x="235" y="477" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">只读模型权重 (Weights)</text>
    <rect x="309" y="460" width="205" height="26" rx="4" fill="#10b981"/>
    <text x="411" y="477" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">KV Cache (随并发与序列增长)</text>
    <rect x="518" y="460" width="72" height="26" rx="4" fill="#f59e0b"/>
    <text x="554" y="477" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">临时激活</text>
    <rect x="594" y="460" width="241" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4,3"/>
    <text x="714" y="477" text-anchor="middle" font-size="11" fill="#64748b">省去梯度与优化器状态，显存大幅降低</text>
  </g>
</svg>
