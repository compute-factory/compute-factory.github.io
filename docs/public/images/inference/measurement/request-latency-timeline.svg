<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620">
  <defs>
    <filter id="soft-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#222018" flood-opacity="0.05" />
    </filter>
    <marker id="arr-slate" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- 18px warm ivory border halo + soft shadow rounded white card -->
  <rect width="1120" height="620" fill="#fffdf7" />
  <rect x="18" y="18" width="1084" height="584" rx="22" fill="#ffffff" stroke="#ebe3d0" stroke-width="1.5" filter="url(#soft-shadow)" />

  <!-- Top kicker & main title -->
  <text x="54" y="56" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#925b00" letter-spacing="0.3">Latency Metrics · TTFT / TPOT / ITL / E2EL</text>
  <text x="54" y="88" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#222018" letter-spacing="-0.3">一次流式推理请求的延迟拆解与 ITL 尖峰示意</text>
  <text x="54" y="112" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6b6354">把整条请求切分为首词元延迟（TTFT）与解码词元间间隔（ITL），才能暴露批内抢占造成的卡顿</text>

  <!-- Main Timeline Container -->
  <rect x="52" y="132" width="1016" height="364" rx="18" fill="#fffefb" stroke="#d9d0bd" stroke-width="1.4" />

  <!-- TTFT top span -->
  <line x1="88" y1="176" x2="392" y2="176" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
  <line x1="88" y1="168" x2="88" y2="184" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
  <line x1="392" y1="168" x2="392" y2="184" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
  <rect x="150" y="156" width="180" height="28" rx="8" fill="#fff8dc" stroke="#e6c665" stroke-width="1.2" />
  <text x="240" y="175" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#7c4a03">TTFT = t<tspan dy="3" font-size="10">1</tspan><tspan dy="-3" font-size="13"> − t</tspan><tspan dy="3" font-size="10">send</tspan></text>

  <!-- Decode top span -->
  <line x1="392" y1="176" x2="1014" y2="176" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
  <line x1="1014" y1="168" x2="1014" y2="184" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
  <rect x="578" y="156" width="252" height="28" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2" />
  <text x="704" y="175" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Decode 总耗时 = (N<tspan dy="3" font-size="10">out</tspan><tspan dy="-3" font-size="13"> − 1) × TPOT</tspan></text>

  <!-- Stage Blocks -->
  <!-- 1. Queue -->
  <rect x="88" y="218" width="112" height="74" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" />
  <text x="144" y="249" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1e293b">① 排队等待</text>
  <text x="144" y="271" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#64748b">调度队列 / 网络</text>

  <!-- 2. Prefill -->
  <rect x="208" y="218" width="174" height="74" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
  <text x="295" y="249" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">② Prefill 预填充</text>
  <text x="295" y="271" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1e3a8a">并行计算 Prompt + 建 KV</text>

  <!-- Token 1 marker -->
  <line x1="392" y1="202" x2="392" y2="314" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,3" />
  <circle cx="392" cy="255" r="15" fill="#d97706" stroke="#92400e" stroke-width="1.5" />
  <text x="392" y="260" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">T1</text>

  <!-- Decode step D1 -> T2 -->
  <rect x="415" y="226" width="68" height="58" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4" />
  <text x="449" y="260" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Decode</text>
  <circle cx="496" cy="255" r="14" fill="#0d9488" stroke="#115e59" stroke-width="1.4" />
  <text x="496" y="260" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#ffffff">T2</text>

  <!-- Decode step D2 -> T3 -->
  <rect x="518" y="226" width="68" height="58" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4" />
  <text x="552" y="260" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Decode</text>
  <circle cx="599" cy="255" r="14" fill="#0d9488" stroke="#115e59" stroke-width="1.4" />
  <text x="599" y="260" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#ffffff">T3</text>

  <!-- 3. Preemption Stall -->
  <rect x="621" y="218" width="168" height="74" rx="13" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6" />
  <text x="705" y="249" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">③ 批内新 Prefill 插入</text>
  <text x="705" y="271" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b91c1c">阻塞当前解码步（ITL 尖峰）</text>

  <!-- Decode step -> T4 -->
  <rect x="797" y="226" width="58" height="58" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4" />
  <text x="826" y="260" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#0f766e">Decode</text>
  <circle cx="868" cy="255" r="14" fill="#0d9488" stroke="#115e59" stroke-width="1.4" />
  <text x="868" y="260" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="700" fill="#ffffff">T4</text>

  <!-- Ellipsis & final token Tn -->
  <text x="904" y="260" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#8c8270">...</text>
  <rect x="926" y="226" width="70" height="58" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4" />
  <text x="961" y="260" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Decode</text>
  <circle cx="1014" cy="255" r="16" fill="#0f766e" stroke="#134e4a" stroke-width="1.5" />
  <text x="1014" y="260" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">Tn</text>

  <!-- Main Time Axis -->
  <line x1="72" y1="330" x2="1032" y2="330" stroke="#475569" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-slate)" />
  <text x="1038" y="335" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#475569">时间</text>

  <!-- Axis ticks and labels -->
  <line x1="88" y1="322" x2="88" y2="338" stroke="#475569" stroke-width="1.8" />
  <text x="88" y="356" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#334155">t_send</text>
  <text x="88" y="373" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">发出请求</text>

  <line x1="392" y1="322" x2="392" y2="338" stroke="#d97706" stroke-width="1.8" />
  <text x="392" y="356" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#b45309">t₁</text>
  <text x="392" y="373" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#92400e">首个词元</text>

  <line x1="496" y1="325" x2="496" y2="335" stroke="#0d9488" stroke-width="1.5" />
  <text x="496" y="356" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#0f766e">t₂</text>

  <line x1="599" y1="325" x2="599" y2="335" stroke="#0d9488" stroke-width="1.5" />
  <text x="599" y="356" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#0f766e">t₃</text>

  <line x1="868" y1="325" x2="868" y2="335" stroke="#dc2626" stroke-width="1.6" />
  <text x="868" y="356" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#dc2626">t₄</text>

  <line x1="1014" y1="322" x2="1014" y2="338" stroke="#0f766e" stroke-width="1.8" />
  <text x="1014" y="356" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#0f766e">t_end</text>
  <text x="1014" y="373" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#0f766e">完成输出</text>

  <!-- ITL annotations -->
  <line x1="392" y1="396" x2="496" y2="396" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" />
  <line x1="392" y1="390" x2="392" y2="402" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" />
  <line x1="496" y1="390" x2="496" y2="402" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" />
  <text x="444" y="418" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#0f766e">ITL₁（平稳生成）</text>

  <line x1="599" y1="396" x2="868" y2="396" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
  <line x1="599" y1="390" x2="599" y2="402" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
  <line x1="868" y1="390" x2="868" y2="402" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" />
  <rect x="652" y="384" width="164" height="24" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" />
  <text x="734" y="400" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#991b1b">ITL₃ 尖峰（卡顿可见）</text>

  <!-- E2EL bottom span -->
  <line x1="88" y1="454" x2="1014" y2="454" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="88" y1="446" x2="88" y2="462" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="1014" y1="446" x2="1014" y2="462" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <rect x="416" y="440" width="270" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="551" y="459" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1e293b">E2EL 端到端延迟 (t<tspan dy="3" font-size="10">end</tspan><tspan dy="-3" font-size="13"> − t</tspan><tspan dy="3" font-size="10">send</tspan><tspan dy="-3" font-size="13">)</tspan></text>

  <!-- Takeaway Footer Card -->
  <rect x="52" y="514" width="1016" height="62" rx="14" fill="#fff8dc" stroke="#e6c665" stroke-width="1.3" />
  <text x="560" y="540" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#5c430d">实测对照（Qwen/Qwen3-0.6B · 并发 32）：单步 ITL 尖峰 (P99 = 37.75 ms) 被 127 个输出步平均后，P99 TPOT 仅显示为 8.42 ms</text>
  <text x="560" y="562" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#7c5a10">TPOT 度量整条请求的平均吐字速率，只有 ITL 分位数才能暴露流式输出中途被新 Prefill 抢占的瞬间卡顿。</text>
</svg>
