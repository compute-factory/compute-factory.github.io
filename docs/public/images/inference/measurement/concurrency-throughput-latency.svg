  <rect x="139" y="451.9" width="24" height="16.1" rx="4" fill="#2563eb" />
  <rect x="169" y="451.9" width="24" height="16.1" rx="4" fill="#0d9488" />
  <text x="166" y="443" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1e3a8a">2.80</text>

