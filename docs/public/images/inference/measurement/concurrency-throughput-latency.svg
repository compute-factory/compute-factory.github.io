  <text x="786" y="449" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#1e40af">15.0</text>
  <text x="880" y="454" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#1e40af">102.9</text>
  <text x="974" y="444" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#1e40af">136.3</text>

  <!-- P99 line: 14.18->463.3, 21.60->460.9, 216.97->396.7, 661.28->250.7 -->
