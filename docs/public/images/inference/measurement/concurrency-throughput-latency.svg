  <text x="102" y="299.5" text-anchor="end" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="400" fill="#64748b">30</text>
  <text x="102" y="242" text-anchor="end" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="400" fill="#64748b">40</text>

