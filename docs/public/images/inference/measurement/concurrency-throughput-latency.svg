  <line x1="112" y1="468" x2="508" y2="468" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="112" y1="410.5" x2="508" y2="410.5" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3" />
