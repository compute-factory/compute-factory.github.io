  <text x="786" y="492" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#334155">C = 8</text>
  <text x="880" y="492" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#334155">C = 32</text>
  <text x="974" y="492" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#334155">C = 64</text>

