<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620">
  <defs>
    <filter id="soft-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#222018" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Outer warm ivory halo + soft shadow rounded white card -->
  <rect width="1120" height="620" fill="#fffdf7" />
  <rect x="18" y="18" width="1084" height="584" rx="22" fill="#ffffff" stroke="#ebe3d0" stroke-width="1.5" filter="url(#soft-shadow)" />

  <!-- Top kicker & main title (hardware-agnostic) -->
  <text x="54" y="56" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#925b00" letter-spacing="0.3">Concurrency Sweep · Throughput vs Goodput Knee</text>
  <text x="54" y="88" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#222018" letter-spacing="-0.3">并发度对吞吐量、Goodput 与尾延迟的影响（单卡 GPU 实测）</text>
  <text x="54" y="112" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6b6354">负载：Qwen/Qwen3-0.6B（bfloat16）· 输入 512 / 输出 128 · SLO：TTFT ≤ 200 ms 且 TPOT ≤ 15 ms</text>

  <!-- LEFT PANEL -->
  <rect x="52" y="132" width="494" height="444" rx="18" fill="#fffefb" stroke="#d9d0bd" stroke-width="1.4" />
  <rect x="76" y="148" width="446" height="32" rx="10" fill="#f0fdfa" />
  <text x="299" y="169" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14.5" font-weight="700" fill="#0f766e">A. 请求吞吐 vs SLO 有效吞吐 (req/s)</text>

  <!-- Legend Left -->
  <rect x="150" y="196" width="14" height="10" rx="2" fill="#2563eb" />
  <text x="170" y="205" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#334155">总请求吞吐 (req/s)</text>
  <rect x="316" y="196" width="14" height="10" rx="2" fill="#0d9488" />
  <text x="336" y="205" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#334155">Goodput (req/s)</text>

