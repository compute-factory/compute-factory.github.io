  <text x="166" y="492" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#334155">C = 1</text>
  <text x="260" y="492" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#334155">C = 8</text>
  <text x="354" y="492" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#334155">C = 32</text>
  <text x="448" y="492" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" fill="#334155">C = 64</text>

