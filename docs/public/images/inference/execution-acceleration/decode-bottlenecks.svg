<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .card-title { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #334155; }
      .small { font-size: 12px; font-weight: 600; }
      .tag { font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">LLM Decode 阶段的双侧瓶颈与三类无损加速路径</text>

  <!-- Prefill Card -->
  <rect x="30" y="58" width="435" height="172" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
  <rect x="30" y="58" width="435" height="36" rx="10" fill="#eff6ff" />
  <rect x="30" y="84" width="435" height="10" fill="#eff6ff" />
  <line x1="30" y1="94" x2="465" y2="94" stroke="#bfdbfe" stroke-width="1" />
  <text x="48" y="81" class="card-title" fill="#1d4ed8">Prefill 阶段：计算受限 (Compute-Bound)</text>
  <text x="48" y="118" class="body">• 输入规模：单次并行处理 Batch × SeqLen 个 Token</text>
  <text x="48" y="142" class="body">• 核心算子：大矩阵乘（GEMM），权重参数被高度复用</text>
  <text x="48" y="166" class="body">• 算术强度：远高于硬件脊点（H100 FP16 约 295 FLOPs/Byte）</text>
  <rect x="48" y="184" width="248" height="28" rx="6" fill="#dbeafe" />
  <text x="172" y="203" text-anchor="middle" class="small" fill="#1e40af">Tensor Core 处于饱和计算状态</text>

  <!-- Decode Card -->
  <rect x="495" y="58" width="435" height="172" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
  <rect x="495" y="58" width="435" height="36" rx="10" fill="#fef2f2" />
  <rect x="495" y="84" width="435" height="10" fill="#fef2f2" />
  <line x1="495" y1="94" x2="930" y2="94" stroke="#fecaca" stroke-width="1" />
  <text x="513" y="81" class="card-title" fill="#b91c1c">Decode 阶段：双侧瓶颈导致算力闲置</text>
  <text x="513" y="118" class="body">• 输入规模：每步仅处理 Batch × 1 个新生成 Token</text>
  <text x="513" y="142" class="body">• GPU 侧瓶颈：权重与 KV Cache 读写多，受限于 HBM 带宽</text>
  <text x="513" y="166" class="body">• CPU 侧瓶颈：算子碎片化，大量微秒级 Kernel 发射产生空泡</text>
  <rect x="513" y="184" width="276" height="28" rx="6" fill="#fee2e2" />
  <text x="651" y="203" text-anchor="middle" class="small" fill="#991b1b">计算单元在等待数据与调度中空转</text>

  <!-- Connecting Arrows -->
  <!-- From GPU memory bottleneck to Card 1 (Fusion) and Card 3 (Speculative) -->
  <path d="M 600 230 L 600 256 L 173 256 L 173 282" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <path d="M 712 230 L 712 256 L 787 256 L 787 282" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <!-- From CPU launch overhead to Card 2 (CUDA Graphs) -->
  <path d="M 550 230 L 550 268 L 480 268 L 480 282" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-amber)" />

  <rect x="285" y="244" width="166" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="368" y="259" text-anchor="middle" class="tag" fill="#b91c1c">应对 GPU 访存墙</text>

  <rect x="720" y="244" width="174" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="807" y="259" text-anchor="middle" class="tag" fill="#b91c1c">提高单步算术强度</text>

  <!-- Bottom Cards -->
  <!-- Card 1: Operator Fusion -->
  <rect x="30" y="290" width="286" height="202" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" />
  <rect x="46" y="304" width="132" height="22" rx="5" fill="#ccfbf1" />
  <text x="112" y="319" text-anchor="middle" class="tag" fill="#0f766e">方向一：减少显存往返</text>
  <text x="46" y="350" class="card-title" fill="#0f766e">算子融合</text>
  <text x="46" y="370" class="small" fill="#64748b">Operator Fusion</text>
  <line x1="46" y1="382" x2="300" y2="382" stroke="#e2e8f0" stroke-width="1" />
  <text x="46" y="405" class="body">• 相邻算子合并为单个 Kernel</text>
  <text x="46" y="429" class="body">• 中间结果驻留寄存器与 SRAM</text>
  <text x="46" y="453" class="body">• 省去中间张量 HBM 读写往返</text>
  <text x="46" y="477" class="small" fill="#0f766e">→ 降低带宽占用与启动次数</text>

  <!-- Card 2: CUDA Graphs -->
  <rect x="337" y="290" width="286" height="202" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
  <rect x="353" y="304" width="132" height="22" rx="5" fill="#fef3c7" />
  <text x="419" y="319" text-anchor="middle" class="tag" fill="#b45309">方向二：消除发射空泡</text>
  <text x="353" y="350" class="card-title" fill="#b45309">CUDA Graphs</text>
  <text x="353" y="370" class="small" fill="#64748b">Graph Capture &amp; Replay</text>
  <line x1="353" y1="382" x2="607" y2="382" stroke="#e2e8f0" stroke-width="1" />
  <text x="353" y="405" class="body">• 预先录制整段计算图与地址</text>
  <text x="353" y="429" class="body">• 推理时 CPU 只需单次 Replay</text>
  <text x="353" y="453" class="body">• 消除层间上百次 Launch 开销</text>
  <text x="353" y="477" class="small" fill="#b45309">→ 消除 CPU 调度导致的 GPU 气泡</text>

  <!-- Card 3: Speculative Decoding -->
  <rect x="644" y="290" width="286" height="202" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
  <rect x="660" y="304" width="132" height="22" rx="5" fill="#ede9fe" />
  <text x="726" y="319" text-anchor="middle" class="tag" fill="#6d28d9">方向三：提升计算并行度</text>
  <text x="660" y="350" class="card-title" fill="#6d28d9">投机解码</text>
  <text x="660" y="370" class="small" fill="#64748b">Speculative Decoding</text>
  <line x1="660" y1="382" x2="914" y2="382" stroke="#e2e8f0" stroke-width="1" />
  <text x="660" y="405" class="body">• 草稿模型先生成 γ 个候选词</text>
  <text x="660" y="429" class="body">• 目标模型单步并行验证全部候选</text>
  <text x="660" y="453" class="body">• 拒绝采样保障分布数学等价</text>
  <text x="660" y="477" class="small" fill="#6d28d9">→ 一次读权重产出多个等价 Token</text>
</svg>
