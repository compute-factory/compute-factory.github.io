<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620">
  <defs>
    <filter id="soft-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#222018" flood-opacity="0.05" />
    </filter>
    <pattern id="soft-hatch-red" width="10" height="10" patternTransform="rotate(38)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fef2f2" />
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fecaca" stroke-width="2.2" />
    </pattern>
    <marker id="arr-warm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#8c8270" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Warm ivory canvas & rounded white card matching Compute Factory theme -->
  <rect width="1120" height="620" fill="#fffdf7" />
  <rect x="18" y="18" width="1084" height="584" rx="22" fill="#ffffff" stroke="#ebe3d0" stroke-width="1.5" filter="url(#soft-shadow)" />

  <!-- Top kicker & title -->
  <text x="52" y="56" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#925b00" letter-spacing="0.3">Speculative Decoding · Draft-then-Verify</text>
  <text x="52" y="88" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#222018" letter-spacing="-0.3">投机解码：草稿生成、单步并行验证与拒绝采样</text>

  <!-- Column 1: Stage 1 (Drafting) -->
  <rect x="52" y="116" width="300" height="414" rx="18" fill="#fffefb" stroke="#d9d0bd" stroke-width="1.4" />
  <rect x="76" y="132" width="252" height="32" rx="10" fill="#f5f3ff" />
  <text x="202" y="153" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">阶段 1：草稿生成</text>

  <!-- Prefix box -->
  <rect x="92" y="182" width="220" height="48" rx="14" fill="#fff8dc" stroke="#e6c665" stroke-width="1.4" />
  <text x="202" y="211" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5c430d">已有前缀  t<tspan dy="3" font-size="10">1</tspan><tspan dy="-3" font-size="14"> … t</tspan><tspan dy="3" font-size="10">n</tspan></text>

  <line x1="202" y1="230" x2="202" y2="256" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-purple)" />

  <rect x="106" y="260" width="192" height="44" rx="13" fill="#f8f5ff" stroke="#c4b5fd" stroke-width="1.4" />
  <text x="202" y="287" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#4c1d95">候选词元 x<tspan dy="3" font-size="10">1</tspan><tspan dy="-3" font-size="14">  (分布 q</tspan><tspan dy="3" font-size="10">1</tspan><tspan dy="-3" font-size="14">)</tspan></text>

  <line x1="202" y1="304" x2="202" y2="326" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-purple)" />

  <rect x="106" y="330" width="192" height="44" rx="13" fill="#f8f5ff" stroke="#c4b5fd" stroke-width="1.4" />
  <text x="202" y="357" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#4c1d95">候选词元 x<tspan dy="3" font-size="10">2</tspan><tspan dy="-3" font-size="14">  (分布 q</tspan><tspan dy="3" font-size="10">2</tspan><tspan dy="-3" font-size="14">)</tspan></text>

  <line x1="202" y1="374" x2="202" y2="396" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-purple)" />

  <rect x="106" y="400" width="192" height="44" rx="13" fill="#f8f5ff" stroke="#c4b5fd" stroke-width="1.4" />
  <text x="202" y="427" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#4c1d95">候选词元 x<tspan dy="3" font-size="10">3</tspan><tspan dy="-3" font-size="14">  (分布 q</tspan><tspan dy="3" font-size="10">3</tspan><tspan dy="-3" font-size="14">)</tspan></text>

  <line x1="202" y1="444" x2="202" y2="466" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-purple)" />

  <rect x="106" y="470" width="192" height="44" rx="13" fill="#f8f5ff" stroke="#c4b5fd" stroke-width="1.4" />
  <text x="202" y="497" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#4c1d95">候选词元 x<tspan dy="3" font-size="10">4</tspan><tspan dy="-3" font-size="14">  (分布 q</tspan><tspan dy="3" font-size="10">4</tspan><tspan dy="-3" font-size="14">)</tspan></text>

  <text x="202" y="562" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#5a5549">Draft Model 串行猜想 γ = 4 步</text>

  <!-- Connector 1 -> 2 -->
  <path d="M 352 323 C 372 323, 376 323, 398 323" fill="none" stroke="#8c8270" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-warm)" />

  <!-- Column 2: Stage 2 (Parallel Verification) -->
  <rect x="404" y="116" width="312" height="414" rx="18" fill="#fffefb" stroke="#d9d0bd" stroke-width="1.4" />
  <rect x="428" y="132" width="264" height="32" rx="10" fill="#eff6ff" />
  <text x="560" y="153" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">阶段 2：单步并行验证</text>

  <!-- Target Model wide soft card -->
  <rect x="424" y="192" width="160" height="308" rx="16" fill="#f4f8ff" stroke="#93c5fd" stroke-width="1.4" />
  <text x="504" y="286" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Target Model</text>
  <text x="504" y="316" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1e3a8a">单步并行前向</text>
  <text x="504" y="344" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#3b82f6">(Causal Mask)</text>
  <rect x="438" y="374" width="132" height="54" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="1.2" />
  <text x="504" y="396" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#5a5549">输入拼接序列</text>
  <text x="504" y="416" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">[t<tspan dy="2" font-size="9">n</tspan><tspan dy="-2" font-size="12">, x</tspan><tspan dy="2" font-size="9">1</tspan><tspan dy="-2" font-size="12">, x</tspan><tspan dy="2" font-size="9">2</tspan><tspan dy="-2" font-size="12">, x</tspan><tspan dy="2" font-size="9">3</tspan><tspan dy="-2" font-size="12">, x</tspan><tspan dy="2" font-size="9">4</tspan><tspan dy="-2" font-size="12">]</tspan></text>

  <!-- 5 parallel output distributions -->
  <path d="M 584 218 C 598 218, 604 218, 616 218" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-blue)" />
  <rect x="622" y="196" width="72" height="44" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
  <text x="658" y="222" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1e40af">p<tspan dy="3" font-size="10">1</tspan></text>

  <path d="M 584 282 C 598 282, 604 282, 616 282" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-blue)" />
  <rect x="622" y="260" width="72" height="44" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
  <text x="658" y="286" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1e40af">p<tspan dy="3" font-size="10">2</tspan></text>

  <path d="M 584 346 C 598 346, 604 346, 616 346" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-blue)" />
  <rect x="622" y="324" width="72" height="44" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
  <text x="658" y="350" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1e40af">p<tspan dy="3" font-size="10">3</tspan></text>

  <path d="M 584 410 C 598 410, 604 410, 616 410" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-blue)" />
  <rect x="622" y="388" width="72" height="44" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
  <text x="658" y="414" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1e40af">p<tspan dy="3" font-size="10">4</tspan></text>

  <path d="M 584 474 C 598 474, 604 474, 616 474" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-blue)" />
  <rect x="622" y="452" width="72" height="44" rx="12" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="4,3" />
  <text x="658" y="478" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#2563eb">p<tspan dy="3" font-size="10">5</tspan></text>

  <text x="560" y="562" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#5a5549">只读 1 次权重，并行产出 5 个精确分布</text>

  <!-- Connector 2 -> 3 -->
  <path d="M 716 323 C 736 323, 740 323, 762 323" fill="none" stroke="#8c8270" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-warm)" />

  <!-- Column 3: Stage 3 (Rejection Sampling) -->
  <rect x="768" y="116" width="300" height="414" rx="18" fill="#fffefb" stroke="#d9d0bd" stroke-width="1.4" />
  <rect x="792" y="132" width="252" height="32" rx="10" fill="#ecfdf5" />
  <text x="918" y="153" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#15803d">阶段 3：逐位拒绝采样</text>

  <!-- Status 1 -->
  <rect x="794" y="186" width="248" height="68" rx="14" fill="#f2fbf6" stroke="#6ee7b7" stroke-width="1.4" />
  <text x="918" y="213" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#047857">位置 1：接受 x<tspan dy="3" font-size="10">1</tspan><tspan dy="-3" font-size="14"> ✓</tspan></text>
  <text x="918" y="236" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#3f6255">命中概率 min(1, p<tspan dy="2" font-size="9">1</tspan><tspan dy="-2" font-size="12">/q</tspan><tspan dy="2" font-size="9">1</tspan><tspan dy="-2" font-size="12">)，保留输出</tspan></text>

  <!-- Status 2 -->
  <rect x="794" y="270" width="248" height="68" rx="14" fill="#f2fbf6" stroke="#6ee7b7" stroke-width="1.4" />
  <text x="918" y="297" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#047857">位置 2：接受 x<tspan dy="3" font-size="10">2</tspan><tspan dy="-3" font-size="14"> ✓</tspan></text>
  <text x="918" y="320" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#3f6255">命中概率 min(1, p<tspan dy="2" font-size="9">2</tspan><tspan dy="-2" font-size="12">/q</tspan><tspan dy="2" font-size="9">2</tspan><tspan dy="-2" font-size="12">)，保留输出</tspan></text>

  <!-- Status 3 -->
  <rect x="794" y="354" width="248" height="72" rx="14" fill="url(#soft-hatch-red)" stroke="#fca5a5" stroke-width="1.4" />
  <text x="918" y="382" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">位置 3：拒绝 x<tspan dy="3" font-size="10">3</tspan><tspan dy="-3" font-size="14"> → 重采样 x'</tspan><tspan dy="3" font-size="10">3</tspan></text>
  <text x="918" y="406" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#8c3b3b">从 norm(max(0, p<tspan dy="2" font-size="9">3</tspan><tspan dy="-2" font-size="12"> - q</tspan><tspan dy="2" font-size="9">3</tspan><tspan dy="-2" font-size="12">)) 修正采样</tspan></text>

  <!-- Status 4 -->
  <rect x="794" y="442" width="248" height="68" rx="14" fill="#faf9f5" stroke="#d9d0bd" stroke-width="1.4" stroke-dasharray="5,4" />
  <text x="918" y="469" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#736a58">位置 4：作废 x<tspan dy="3" font-size="10">4</tspan><tspan dy="-3" font-size="14"> ✗</tspan></text>
  <text x="918" y="492" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#736a58">前缀已在位置 3 分叉，本轮净产出 3 词</text>

  <text x="918" y="562" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#047857">最终分布与 Target Model 严格等价</text>
</svg>
