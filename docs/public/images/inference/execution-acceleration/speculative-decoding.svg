<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .step-title { font-size: 15px; font-weight: 700; }
      .tok { font-size: 13px; font-weight: 700; }
      .body { font-size: 12px; fill: #334155; }
      .small { font-size: 11px; font-weight: 600; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="960" height="490" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="480" y="34" text-anchor="middle" class="title">投机解码（Speculative Decoding）单轮 Draft-then-Verify 流程</text>

  <!-- Step 1: Draft Model -->
  <rect x="28" y="54" width="904" height="118" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
  <rect x="44" y="66" width="526" height="24" rx="5" fill="#ede9fe" />
  <text x="56" y="83" class="step-title" fill="#6d28d9">阶段 1：草稿生成（Draft Model 自回归串行生成 γ = 4 个候选）</text>
  <text x="912" y="83" text-anchor="end" class="small" fill="#6d28d9">小模型参数量小，每步耗时极低</text>

  <!-- Prefix -->
  <rect x="48" y="106" width="136" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
  <text x="116" y="127" text-anchor="middle" class="tok" fill="#1e293b">已有前缀</text>
  <text x="116" y="145" text-anchor="middle" class="body">[t₁, ..., tₙ]</text>

  <line x1="184" y1="130" x2="220" y2="130" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-purple)" />

  <!-- Draft tokens -->
  <rect x="224" y="106" width="138" height="48" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3" />
  <text x="293" y="126" text-anchor="middle" class="tok" fill="#5b21b6">候选 x₁（q₁）</text>
  <text x="293" y="144" text-anchor="middle" class="small" fill="#64748b">Draft 第 1 步</text>

  <line x1="362" y1="130" x2="394" y2="130" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-purple)" />

  <rect x="398" y="106" width="138" height="48" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3" />
  <text x="467" y="126" text-anchor="middle" class="tok" fill="#5b21b6">候选 x₂（q₂）</text>
  <text x="467" y="144" text-anchor="middle" class="small" fill="#64748b">Draft 第 2 步</text>

  <line x1="536" y1="130" x2="568" y2="130" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-purple)" />

  <rect x="572" y="106" width="138" height="48" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3" />
  <text x="641" y="126" text-anchor="middle" class="tok" fill="#5b21b6">候选 x₃（q₃）</text>
  <text x="641" y="144" text-anchor="middle" class="small" fill="#64748b">Draft 第 3 步</text>

  <line x1="710" y1="130" x2="742" y2="130" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-purple)" />

  <rect x="746" y="106" width="166" height="48" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.3" />
  <text x="829" y="126" text-anchor="middle" class="tok" fill="#5b21b6">候选 x₄（q₄）</text>
  <text x="829" y="144" text-anchor="middle" class="small" fill="#64748b">Draft 第 4 步</text>

  <!-- Step 2: Target Parallel Verify -->
  <rect x="28" y="186" width="904" height="122" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <rect x="44" y="198" width="584" height="24" rx="5" fill="#eff6ff" />
  <text x="56" y="215" class="step-title" fill="#1d4ed8">阶段 2：目标模型单次并行验证（Target Model 1 次 Forward 算 5 个位置）</text>
  <text x="912" y="215" text-anchor="end" class="small" fill="#1d4ed8">一次加载权重，提升算术强度</text>

  <!-- Input sequence box -->
  <rect x="48" y="238" width="136" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
  <text x="116" y="259" text-anchor="middle" class="tok" fill="#1e293b">输入位置 tₙ</text>
  <text x="116" y="278" text-anchor="middle" class="small" fill="#1d4ed8">并行输出 p₁(·)</text>

  <rect x="224" y="238" width="138" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
  <text x="293" y="259" text-anchor="middle" class="tok" fill="#1e40af">输入 x₁</text>
  <text x="293" y="278" text-anchor="middle" class="small" fill="#1d4ed8">并行输出 p₂(·)</text>

  <rect x="398" y="238" width="138" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
  <text x="467" y="259" text-anchor="middle" class="tok" fill="#1e40af">输入 x₂</text>
  <text x="467" y="278" text-anchor="middle" class="small" fill="#1d4ed8">并行输出 p₃(·)</text>

  <rect x="572" y="238" width="138" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
  <text x="641" y="259" text-anchor="middle" class="tok" fill="#1e40af">输入 x₃</text>
  <text x="641" y="278" text-anchor="middle" class="small" fill="#1d4ed8">并行输出 p₄(·)</text>

  <rect x="746" y="238" width="166" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
  <text x="829" y="259" text-anchor="middle" class="tok" fill="#1e40af">输入 x₄</text>
  <text x="829" y="278" text-anchor="middle" class="small" fill="#1d4ed8">额外预测 p₅(·)</text>

  <!-- Step 3: Rejection Sampling -->
  <rect x="28" y="322" width="904" height="148" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" />
  <rect x="44" y="334" width="554" height="24" rx="5" fill="#ecfdf5" />
  <text x="56" y="351" class="step-title" fill="#047857">阶段 3：逐位拒绝采样（保证最终输出与 Target Model 分布严格等价）</text>
  <text x="912" y="351" text-anchor="end" class="small" fill="#047857">规则：以 min(1, pᵢ(xᵢ)/qᵢ(xᵢ)) 概率接受</text>

  <!-- Decision cards -->
  <rect x="48" y="374" width="198" height="78" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="147" y="396" text-anchor="middle" class="tok" fill="#047857">位置 1：接受 x₁</text>
  <text x="147" y="416" text-anchor="middle" class="body">p₁(x₁) ≥ q₁(x₁) 或命中接收</text>
  <text x="147" y="436" text-anchor="middle" class="small" fill="#059669">✓ 保留 Token x₁</text>

  <rect x="262" y="374" width="198" height="78" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="361" y="396" text-anchor="middle" class="tok" fill="#047857">位置 2：接受 x₂</text>
  <text x="361" y="416" text-anchor="middle" class="body">命中接收概率 p₂(x₂)/q₂(x₂)</text>
  <text x="361" y="436" text-anchor="middle" class="small" fill="#059669">✓ 保留 Token x₂</text>

  <rect x="476" y="374" width="234" height="78" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="593" y="396" text-anchor="middle" class="tok" fill="#b91c1c">位置 3：拒绝 x₃ → 修正重采样</text>
  <text x="593" y="416" text-anchor="middle" class="body">从 norm(max(0, p₃ - q₃)) 采样</text>
  <text x="593" y="436" text-anchor="middle" class="small" fill="#dc2626">✗ 丢弃 x₃，产出修正 Token x'₃</text>

  <rect x="726" y="374" width="186" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" />
  <text x="819" y="396" text-anchor="middle" class="tok" fill="#475569">位置 4 以后：作废</text>
  <text x="819" y="416" text-anchor="middle" class="body">因前缀已在位置 3 分叉</text>
  <text x="819" y="436" text-anchor="middle" class="small" fill="#0f766e">本轮净产出 3 个确定 Token</text>
</svg>
