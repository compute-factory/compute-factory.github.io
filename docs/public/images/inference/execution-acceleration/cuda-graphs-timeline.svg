<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620">

  <defs>
    <filter id="soft-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#222018" flood-opacity="0.05" />
    </filter>
    <pattern id="soft-hatch-red" width="10" height="10" patternTransform="rotate(38)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fef2f2" />
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fecaca" stroke-width="2.2" />
    </pattern>
    <marker id="arr-warm" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#8c8270" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-red" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2.5 L 9.5 6 L 2 9.5" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect width="1120" height="620" fill="#fffdf7" />
  <rect x="18" y="18" width="1084" height="584" rx="22" fill="#ffffff" stroke="#ebe3d0" stroke-width="1.5" filter="url(#soft-shadow)" />
  <text x="52" y="56" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="400" fill="#925b00" letter-spacing="0.3">CUDA Graphs · Capture, Replay &amp; Piecewise</text>
  <text x="52" y="88" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#222018" letter-spacing="-0.3">CUDA Graphs 原理与分段图（Piecewise）机制</text>

  <!-- Top Left Panel: 1. Eager Mode -->
  <rect x="52" y="116" width="494" height="226" rx="18" fill="#fffefb" stroke="#fecaca" stroke-width="1.5" />
  <rect x="74" y="132" width="286" height="30" rx="9" fill="#fef2f2" />
  <text x="217" y="152" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">1. Eager 模式：逐个发射产生气泡</text>

  <text x="76" y="206" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#4a453b">CPU</text>
  <line x1="116" y1="201" x2="522" y2="201" stroke="#ebe3d0" stroke-width="1.2" />
  <text x="76" y="274" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#4a453b">GPU</text>
  <line x1="116" y1="269" x2="522" y2="269" stroke="#ebe3d0" stroke-width="1.2" />

  <rect x="122" y="184" width="96" height="32" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" />
  <text x="170" y="204" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#78350f">Launch K1</text>

  <rect x="252" y="184" width="96" height="32" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" />
  <text x="300" y="204" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#78350f">Launch K2</text>

  <rect x="382" y="184" width="96" height="32" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" />
  <text x="430" y="204" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#78350f">Launch K3</text>

  <path d="M 178 216 L 192 250" fill="none" stroke="#8c8270" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arr-warm)" />
  <path d="M 308 216 L 322 250" fill="none" stroke="#8c8270" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arr-warm)" />
  <path d="M 438 216 L 452 250" fill="none" stroke="#8c8270" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arr-warm)" />

  <rect x="190" y="253" width="56" height="32" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3" />
  <text x="218" y="274" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#1e40af">K1</text>

  <rect x="250" y="253" width="68" height="32" rx="9" fill="url(#soft-hatch-red)" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4,3" />
  <text x="284" y="274" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">空闲</text>

  <rect x="322" y="253" width="56" height="32" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3" />
  <text x="350" y="274" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#1e40af">K2</text>

  <rect x="382" y="253" width="68" height="32" rx="9" fill="url(#soft-hatch-red)" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4,3" />
  <text x="416" y="274" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#b91c1c">空闲</text>

  <rect x="454" y="253" width="56" height="32" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3" />
  <text x="482" y="274" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#1e40af">K3</text>

  <text x="299" y="320" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#b91c1c">Kernel 发射间隙占比高，短算子间存在大量等待空泡</text>

  <!-- Top Right Panel: 2. CUDA Graph Replay -->
  <rect x="574" y="116" width="494" height="226" rx="18" fill="#fffefb" stroke="#99f6e4" stroke-width="1.5" />
  <rect x="596" y="132" width="322" height="30" rx="9" fill="#f0fdfa" />
  <text x="757" y="152" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f766e">2. CUDA Graph Replay：一次提交连续执行</text>

  <text x="598" y="206" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#4a453b">CPU</text>
  <line x1="638" y1="201" x2="1044" y2="201" stroke="#ebe3d0" stroke-width="1.2" />
  <text x="598" y="274" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#4a453b">GPU</text>
  <line x1="638" y1="269" x2="1044" y2="269" stroke="#ebe3d0" stroke-width="1.2" />

  <rect x="646" y="184" width="184" height="32" rx="9" fill="#d1fae5" stroke="#34d399" stroke-width="1.3" />
  <text x="738" y="204" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" fill="#065f46">cudaGraphLaunch(graph)</text>
  <text x="844" y="204" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#5a5549">提交后 CPU 立即释放</text>

  <path d="M 738 216 L 738 249" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-teal)" />

  <rect x="708" y="253" width="60" height="32" rx="8" fill="#a7f3d0" stroke="#10b981" stroke-width="1.3" />
  <text x="738" y="274" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#064e3b">K1</text>

  <rect x="770" y="253" width="60" height="32" rx="8" fill="#a7f3d0" stroke="#10b981" stroke-width="1.3" />
  <text x="800" y="274" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#064e3b">K2</text>

  <rect x="832" y="253" width="60" height="32" rx="8" fill="#a7f3d0" stroke="#10b981" stroke-width="1.3" />
  <text x="862" y="274" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#064e3b">K3</text>

  <text x="821" y="320" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#0f766e">硬件内部紧凑拉起全图算子，彻底消除中间发射气泡</text>

  <!-- Bottom Wide Panel: 3. Piecewise CUDA Graph -->
  <rect x="52" y="364" width="1016" height="214" rx="18" fill="#fffefb" stroke="#bfdbfe" stroke-width="1.5" />
  <rect x="74" y="380" width="408" height="30" rx="9" fill="#eff6ff" />
  <text x="278" y="400" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">3. 推理引擎 Piecewise 分段图（应对动态长度）</text>
  <text x="1044" y="400" text-anchor="end" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#5a5549">配合离散 Batch 分桶填充（Bucketing &amp; Padding）</text>

  <rect x="78" y="432" width="276" height="96" rx="15" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="216" y="464" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Graph Piece 1（静态图）</text>
  <text x="216" y="492" text-anchor="middle" font-family="JetBrains Mono, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#4a453b">RMSNorm + QKV + RoPE</text>

  <path d="M 354 480 C 378 480, 388 480, 412 480" fill="none" stroke="#d97706" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arr-amber)" />

  <rect x="418" y="432" width="284" height="96" rx="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="560" y="464" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#b45309">Eager 执行（动态算子）</text>
  <text x="560" y="492" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#4a453b">PagedAttention（可变序列长度）</text>

  <path d="M 702 480 C 726 480, 736 480, 760 480" fill="none" stroke="#d97706" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arr-amber)" />

  <rect x="766" y="432" width="276" height="96" rx="15" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="904" y="464" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Graph Piece 2（静态图）</text>
  <text x="904" y="492" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#4a453b">O 投影 + Residual + MLP</text>

  <text x="560" y="556" text-anchor="middle" font-family="Inter, HarmonyOS Sans SC, PingFang SC, Noto Sans SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#736a58">若 Attention 后端支持静态指针元数据（Full CUDA Graph），整层可直接合并进同一张大图</text>

</svg>
