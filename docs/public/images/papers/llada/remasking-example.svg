<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <rect x="4" y="4" width="852" height="432" rx="10" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <text x="24" y="34" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#1e293b">构造算例：低置信度重掩码 4 步采样流转（L = 5, N = 4）</text>
  <text x="24" y="55" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">蓝底 = 前步已锁定（c = 1）；橙框 = 本步高置信度转正；虚线灰框 = 重掩码回 M；绿底 = t = 0 最终输出</text>

  <!-- Column headers -->
  <text x="180" y="84" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">位置 1</text>
  <text x="256" y="84" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">位置 2</text>
  <text x="332" y="84" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">位置 3</text>
  <text x="408" y="84" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">位置 4</text>
  <text x="484" y="84" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">位置 5</text>
  <text x="546" y="84" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748b">本步重掩码依据与结果</text>

  <!-- Row 0: t = 1 -->
  <text x="24" y="117" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="700" fill="#334155">起点 t = 1</text>
  <rect x="150" y="96" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="180" y="118" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text>
  <rect x="226" y="96" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="256" y="118" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text>
  <rect x="302" y="96" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="332" y="118" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text>
  <rect x="378" y="96" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="408" y="118" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text>
  <rect x="454" y="96" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="484" y="118" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text>
  <text x="546" y="117" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">全掩码 Dirac 起点，尚未生成任何词元</text>

  <line x1="68" y1="128" x2="68" y2="156" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Row 1: t=1 -> s=3/4 -->
  <text x="24" y="179" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="700" fill="#334155">第 1 步 (s=3/4)</text>
  <rect x="150" y="158" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="180" y="180" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="180" y="205" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">空 0.82</text>
  <rect x="226" y="158" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="256" y="180" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="256" y="205" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">山 0.45</text>
  <rect x="302" y="158" width="60" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" /><text x="332" y="180" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">不</text><text x="332" y="205" font-family="Consolas, monospace" font-size="10.5" fill="#b45309" font-weight="700" text-anchor="middle">0.91 保留</text>
  <rect x="378" y="158" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="408" y="180" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="408" y="205" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">见 0.38</text>
  <rect x="454" y="158" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="484" y="180" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="484" y="205" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">人 0.60</text>
  <text x="546" y="173" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">保留配额 n_un = floor(5 x 1/4) = 1</text>
  <text x="546" y="191" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">仅保留最高置信词「不」，其余 4 位重掩码</text>

  <line x1="68" y1="194" x2="68" y2="226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Row 2: t=3/4 -> s=1/2 -->
  <text x="24" y="249" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="700" fill="#334155">第 2 步 (s=1/2)</text>
  <rect x="150" y="228" width="60" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" /><text x="180" y="250" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">空</text><text x="180" y="275" font-family="Consolas, monospace" font-size="10.5" fill="#b45309" font-weight="700" text-anchor="middle">0.88 保留</text>
  <rect x="226" y="228" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="256" y="250" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="256" y="275" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">山 0.64</text>
  <rect x="302" y="228" width="60" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" /><text x="332" y="250" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">不</text><text x="332" y="275" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8" text-anchor="middle">c = 1</text>
  <rect x="378" y="228" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="408" y="250" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="408" y="275" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">见 0.55</text>
  <rect x="454" y="228" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="484" y="250" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="484" y="275" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">人 0.79</text>
  <text x="546" y="243" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">保留配额 n_un = floor(5 x 1/2) = 2</text>
  <text x="546" y="261" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">保留「不」与「空」，其余 3 位重掩码</text>

  <line x1="68" y1="264" x2="68" y2="296" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Row 3: t=1/2 -> s=1/4 -->
  <text x="24" y="319" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="700" fill="#334155">第 3 步 (s=1/4)</text>
  <rect x="150" y="298" width="60" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" /><text x="180" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">空</text><text x="180" y="345" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8" text-anchor="middle">c = 1</text>
  <rect x="226" y="298" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="256" y="320" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="256" y="345" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">山 0.74</text>
  <rect x="302" y="298" width="60" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" /><text x="332" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">不</text><text x="332" y="345" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8" text-anchor="middle">c = 1</text>
  <rect x="378" y="298" width="60" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" /><text x="408" y="320" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">M</text><text x="408" y="345" font-family="Consolas, Microsoft YaHei, monospace" font-size="10.5" fill="#475569" text-anchor="middle">见 0.68</text>
  <rect x="454" y="298" width="60" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" /><text x="484" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">人</text><text x="484" y="345" font-family="Consolas, monospace" font-size="10.5" fill="#b45309" font-weight="700" text-anchor="middle">0.92 保留</text>
  <text x="546" y="313" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">保留配额 n_un = floor(5 x 3/4) = 3</text>
  <text x="546" y="331" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">保留「空」「不」「人」，其余 2 位重掩码</text>

  <line x1="68" y1="334" x2="68" y2="366" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Row 4: t=1/4 -> s=0 -->
  <text x="24" y="389" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="700" fill="#334155">第 4 步 (s = 0)</text>
  <rect x="150" y="368" width="60" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="180" y="390" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">空</text><text x="180" y="415" font-family="Consolas, monospace" font-size="10.5" fill="#15803d" text-anchor="middle">c = 1</text>
  <rect x="226" y="368" width="60" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="256" y="390" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">山</text><text x="256" y="415" font-family="Consolas, monospace" font-size="10.5" fill="#15803d" text-anchor="middle">0.95 保留</text>
  <rect x="302" y="368" width="60" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="332" y="390" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">不</text><text x="332" y="415" font-family="Consolas, monospace" font-size="10.5" fill="#15803d" text-anchor="middle">c = 1</text>
  <rect x="378" y="368" width="60" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="408" y="390" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">见</text><text x="408" y="415" font-family="Consolas, monospace" font-size="10.5" fill="#15803d" text-anchor="middle">0.89 保留</text>
  <rect x="454" y="368" width="60" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="484" y="390" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">人</text><text x="484" y="415" font-family="Consolas, monospace" font-size="10.5" fill="#15803d" text-anchor="middle">c = 1</text>
  <text x="546" y="383" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#334155">保留配额 n_un = floor(5 x 1) = 5</text>
  <text x="546" y="401" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#15803d">重掩码数为 0，t = 0 输出完整序列</text>
</svg>
